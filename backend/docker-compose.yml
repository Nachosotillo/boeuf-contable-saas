version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: boeuf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boeuf
      POSTGRES_PASSWORD: boeuf_secret
      POSTGRES_DB: boeuf_contable
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boeuf -d boeuf_contable"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────────────────
  api:
    build: .
    container_name: boeuf_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://boeuf:boeuf_secret@postgres:5432/boeuf_contable
      SECRET_KEY: "${SECRET_KEY:-cambia-esto-en-produccion}"
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

volumes:
  postgres_data:
